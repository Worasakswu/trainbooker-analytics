# Runs the whole pipeline on every push / pull request:
#   schema + seed -> tests -> generate 100k bookings -> load -> tests -> dbt build (65 tests)
# On pushes to main it also publishes the dbt docs site (lineage graph) to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trainbooker
          POSTGRES_PASSWORD: trainbooker
          POSTGRES_DB: trainbooker
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U trainbooker -d trainbooker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # used by psql (libpq) ...
      PGHOST: localhost
      PGPORT: "5544"
      PGUSER: trainbooker
      PGPASSWORD: trainbooker
      PGDATABASE: trainbooker
      PGTZ: Asia/Bangkok
      # ... and by dbt/profiles.yml
      TB_PG_HOST: localhost
      TB_PG_PORT: "5544"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt and psql
        run: |
          pip install -r requirements.txt
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          dbt --version

      - name: Create schema and seed data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/init/01_schema.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/init/02_seed.sql

      - name: Test seed data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/tests/test_constraints.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/tests/test_data_quality.sql

      - name: Generate synthetic data
        run: python generator/generate_data.py

      - name: Load generated data
        run: |
          # the load script reads /data/generated/*.csv (the path inside the Docker container)
          sudo ln -sfn "$GITHUB_WORKSPACE/data" /data
          psql -v ON_ERROR_STOP=1 -f sql/load/load_generated.sql

      - name: Test loaded data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/tests/test_constraints.sql
          psql -v ON_ERROR_STOP=1 -q -f sql/tests/test_data_quality.sql

      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: dbt docs
        working-directory: dbt
        run: |
          dbt docs generate --profiles-dir . --static
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - name: Keep dbt run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
          if-no-files-found: ignore

      - name: Upload docs site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    name: Publish dbt docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
